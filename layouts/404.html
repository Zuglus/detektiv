{{ define "main" }}

{{- $lang := .Lang | default "ru" -}}

<section class="relative overflow-hidden text-white pt-40 pb-20 bg-gradient-header">
  <div class="max-w-4xl mx-auto px-6 text-center">
    <p class="text-8xl font-display font-bold mb-6 text-white/30">404</p>
    <h1 class="text-heading-lg md:text-display-sm font-display font-bold mb-4">
      {{ i18n "pageNotFound" }}
    </h1>
    <p class="text-lg text-white/80 mb-8 max-w-2xl mx-auto">
      {{ i18n "pageNotFoundText" }}
    </p>
    <a href="{{ if eq $lang "ru" }}/{{ else }}/en/{{ end }}"
       class="inline-flex items-center gap-2 px-8 py-4 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-xl text-lg transition-colors">
      {{ i18n "goHome" }}
    </a>
  </div>
</section>

{{ end }}
